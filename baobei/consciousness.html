<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共同意识</title>
    <link rel="stylesheet" href="consciousness.css">
    <style>
        .response-progress {
            position: absolute;
            left: 50%;
            bottom: 1%;
            z-index: 24;
            margin: 0;
            transform: translateX(-50%);
            color: rgba(225, 225, 225, 0.32);
            font-family: Arial, sans-serif;
            font-size: 9px;
            line-height: 1;
            letter-spacing: 2px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.65s ease;
        }

        .response-progress.is-visible {
            opacity: 1;
        }

        @media (max-width: 620px) {
            .response-progress {
                bottom: 1%;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <main class="consciousness-page">

        <section class="consciousness-stage">
            <div class="consciousness-orb">
                <canvas id="orb-particles" class="orb-particles" aria-hidden="true"></canvas>

                <div class="orb-shadow-core" aria-hidden="true"></div>
                <div class="orb-ring orb-ring-one" aria-hidden="true"></div>
                <div class="orb-ring orb-ring-two" aria-hidden="true"></div>

                <div class="orb-message-layer" aria-live="polite" aria-atomic="true">
                    <div class="response-stack">
                        <p id="response-line-1" class="response-line"></p>
                        <p id="response-line-2" class="response-line"></p>
                    </div>
                    <p id="response-progress" class="response-progress" aria-hidden="true"></p>
                </div>
            </div>

            <div class="question-echo-layer" aria-live="polite" aria-atomic="true">
                <p id="question-echo" class="question-echo"></p>
            </div>

            <div class="dialogue-shell">

                <div class="question-row">
                    <input
                        id="question-input"
                        class="question-input"
                        type="text"
                        autocomplete="off"
                        placeholder="你是谁"
                        aria-label="向A级共同意识提问"
                    >
                    <button id="send-question" class="send-question" type="button">发送</button>
                </div>

                <div class="archive-row">
                    <button id="open-archive" class="open-archive" type="button">
                        新世界永存
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="newworld_link.js"></script>
    <script>
        localStorage.setItem('level_a_awakened', 'true');

        const responseLines = [
            document.getElementById('response-line-1'),
            document.getElementById('response-line-2')
        ];

        const originalPageTitle = document.title;
        let titleFlashTimer = null;
        let titleFlashState = false;
        let hasUnreadResponse = false;

        function startTitleFlash(message = '[新回应]共同意识') {
            hasUnreadResponse = true;

            if (titleFlashTimer) return;

            titleFlashTimer = setInterval(() => {
                document.title = titleFlashState
                    ? originalPageTitle
                    : message;

                titleFlashState = !titleFlashState;
            }, 800);
        }

        function stopTitleFlash() {
            if (titleFlashTimer) {
                clearInterval(titleFlashTimer);
                titleFlashTimer = null;
            }

            titleFlashState = false;
            hasUnreadResponse = false;
            document.title = originalPageTitle;
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && hasUnreadResponse) {
                stopTitleFlash();
            }
        });

        window.addEventListener('focus', () => {
            if (hasUnreadResponse) {
                stopTitleFlash();
            }
        });
        const questionEcho = document.getElementById('question-echo');
        const responseProgress = document.getElementById('response-progress');

        let questionEchoFadeTimer = null;
        let questionEchoClearTimer = null;

        function showQuestionEcho(text) {
            if (!questionEcho || !text) return;

            clearTimeout(questionEchoFadeTimer);
            clearTimeout(questionEchoClearTimer);

            questionEcho.classList.remove(
                'is-visible',
                'is-dissolving'
            );

            questionEcho.textContent = text;

            // 强制浏览器重置动画状态
            void questionEcho.offsetWidth;

            questionEcho.classList.add('is-visible');

            questionEchoFadeTimer = setTimeout(() => {
                questionEcho.classList.remove('is-visible');
                questionEcho.classList.add('is-dissolving');
            }, 1250);

            questionEchoClearTimer = setTimeout(() => {
                questionEcho.classList.remove('is-dissolving');
                questionEcho.textContent = '';
            }, 4200);
        }
        const questionInput = document.getElementById('question-input');
        const sendQuestionBtn = document.getElementById('send-question');
        const openArchiveBtn = document.getElementById('open-archive');
        const statusText = document.getElementById('consciousness-status');

        // “你是谁”只在本次页面体验中出现一次。
        // 玩家提问后消失；重新进入共同意识页面时会再次出现。
        let firstQuestionUsed = false;
        questionInput.placeholder = '你是谁';

        const answers = [
            {
                test: (text) => /你是谁|你们是谁/.test(text),
                reply: [
                    '我们是A级居民。',
                    '我们不再依附物质而存在。',
                    '你所看见的，只是我们为你保留的沟通窗口。',
                    '我们共享意识，所以这里已经没有‘我’。',
                    '我是我，我们也是我，我也是我们。'
                ],
                after() {
                    NewWorldLink.send('guide_logo', {});
                }
            },
            {
                test: (text) => /新世界/.test(text),
                reply: [
                    '新世界中，你的存在将不再被局限。',
                    '你可以摒弃一切却依然存在。',
                    '是什么让你存在，由你决定。'
                ]
            },
            {
                test: (text) => /周言安|陈木泽/.test(text),
                reply: [
                    '名字会改变，但习惯不会。',
                    '或许你说过的话，',
                    '会为他带来新的希望。'
                ]
            },
            {
                test: (text) => /居民编号/.test(text),
                reply: [
                    '自2026年起，居民编号调整为',
                    '场域编号-姓名首字母-五位位序数字',
                    '位序数字代表着你是该场域第几位居民。'
                ]
            },
            {
                test: (text) => /回去/.test(text),
                reply: [
                    '舍弃前尘的一切需要勇气。',
                    '或许他的身份，还有恢复的余地。',
                    '尝试找到 出世 的方法，然后恢复他的身份吧。'
                ]
            },
            {
                test: (text) => /乱码螺母/.test(text),
                reply: [
                    '我们知道你是谁，',
                    '你自己知道吗？'
                ]
            },
            {
                test: (text) => /肉体/.test(text),
                reply: [
                    '如果你不知道他在哪里',
                    '总有人会知道的。他们是谁呢？'
                ]
            },
            {
                test: (text) => /唤醒意识|唤醒/.test(text),
                reply: [
                    '所有的意识受该场域管理员控制',
                    '人类的意识并没有消失，只是被封存了。毕竟这些都是珍贵的数据。',
                    '如果你可以将他的意识从管理员控制的名单里删除，他还有回来的希望。'

                ]
            },
            {
                test: (text) => /管理员/.test(text),
                reply: [
                    '2013年起，管理员就不只是一个居民了。',
                    'B级和C级居民所需的生存资源日益增多，新世界需要生产这些资源。',
                    '于是管理员变成了一个居民和它。',
                    '他们都是管理员，一个管理员住在另一个管理员之中。'

                ]
            },
            {
                test: (text) => /水库/.test(text),
                reply: [
                    '自从各地的水库成为管理员，处理不听话的居民就变得简单多了。',
                    '水库能藏下的秘密比任何人想象的都要多。',
                    '它们是居民们最忠诚，最坚实的守护者。',
                    '管理员的密码，也默认为了水库的经度和纬度的整数部分。'
                ]
            },
            {
                test: (text) => /出世报告/.test(text),
                reply: [
                    '你很聪明，知道这样的问题只有我能回答。他们是不可能让你知道的。',
                    '这个报告不能通过平台的任何一个按钮进入。',
                    '你能走到这里，说明你相信了一种，且是唯一一种存在方式。',
                    '或许你是对的，又或许错了。html的名字是exit，离开吧。'
                ]
            },
            {
                test: (text) => /我是谁|我是誰|我是什么/.test(text),
                reply: [
                    '什么是‘我’？',
                    '你称呼自己为我，我们称呼自己也为我。',
                    '这个字本身没有任何含义',
                    '当你使用这个字的时候，称呼的是你的容器，还是你的意识？',
                    '当你的容器消亡了以后，你的意识是否还能自称‘我’？',
                    '又或者，当你的意识消亡了以后，你的容器是否还能自称‘我’？'
                ]
            }
        ];

        const speechQueue = [];
        let isSpeaking = false;

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        let previousResponseText = '';

        async function showOneRollingLine(item) {
            const upperLine = responseLines[0];
            const currentLine = responseLines[1];

            if (responseProgress) {
                responseProgress.textContent = `${item.position}/${item.total}`;
                responseProgress.classList.add('is-visible');
            }

            upperLine.getAnimations().forEach((animation) => animation.cancel());
            currentLine.getAnimations().forEach((animation) => animation.cancel());

            upperLine.className = 'response-line';
            currentLine.className = 'response-line';

            if (previousResponseText) {
                upperLine.textContent = previousResponseText;
                upperLine.style.opacity = '1';
                upperLine.style.filter = 'blur(0px)';
                upperLine.style.transform = 'translate3d(0, 0, 0) scale(1)';
                upperLine.style.color = 'rgba(232, 232, 232, 0.74)';
            } else {
                upperLine.textContent = '';
                upperLine.style.opacity = '0';
            }

            currentLine.textContent = item.text;
            currentLine.style.opacity = '0';
            currentLine.style.filter = 'blur(7px)';
            currentLine.style.transform = 'translate3d(0, 30px, 0) scale(0.985)';
            currentLine.style.color = 'rgba(232, 232, 232, 0.74)';

            await new Promise((resolve) => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(resolve);
                });
            });

            const duration = 1750;
            const easing = 'cubic-bezier(0.16, 1, 0.3, 1)';

            const animations = [];

            if (previousResponseText) {
                animations.push(
                    upperLine.animate(
                        [
                            {
                                transform: 'translate3d(0, 0, 0) scale(1)',
                                opacity: 1,
                                filter: 'blur(0px)',
                                color: 'rgba(232, 232, 232, 0.74)'
                            },
                            {
                                offset: 0.72,
                                transform: 'translate3d(0, -20px, 0) scale(0.992)',
                                opacity: 0.74,
                                filter: 'blur(0.15px)',
                                color: 'rgba(218, 218, 218, 0.46)'
                            },
                            {
                                transform: 'translate3d(0, -24px, 0) scale(0.99)',
                                opacity: 0.68,
                                filter: 'blur(0.25px)',
                                color: 'rgba(210, 210, 210, 0.40)'
                            }
                        ],
                        {
                            duration,
                            easing,
                            fill: 'forwards'
                        }
                    )
                );
            }

            animations.push(
                currentLine.animate(
                    [
                        {
                            transform: 'translate3d(0, 30px, 0) scale(0.985)',
                            opacity: 0,
                            filter: 'blur(7px)'
                        },
                        {
                            offset: 0.18,
                            opacity: 0.18
                        },
                        {
                            offset: 0.72,
                            transform: 'translate3d(0, 2px, 0) scale(0.998)',
                            opacity: 0.92,
                            filter: 'blur(0.35px)'
                        },
                        {
                            transform: 'translate3d(0, 0, 0) scale(1)',
                            opacity: 1,
                            filter: 'blur(0px)'
                        }
                    ],
                    {
                        duration,
                        easing,
                        fill: 'forwards'
                    }
                )
            );

            await Promise.all(
                animations.map((animation) => animation.finished.catch(() => {}))
            );

            if (previousResponseText) {
                upperLine.style.transform = 'translate3d(0, -24px, 0) scale(0.99)';
                upperLine.style.opacity = '0.68';
                upperLine.style.filter = 'blur(0.25px)';
                upperLine.style.color = 'rgba(210, 210, 210, 0.40)';
            }

            currentLine.style.transform = 'translate3d(0, 0, 0) scale(1)';
            currentLine.style.opacity = '1';
            currentLine.style.filter = 'blur(0px)';

            const hold = item.hold || 1500;
            await wait(hold);

            previousResponseText = item.text;

            if (item.after) {
                item.after();
            }
        }

        async function processSpeechQueue() {
            if (isSpeaking) return;
            isSpeaking = true;

            while (speechQueue.length > 0) {
                const item = speechQueue.shift();
                await showOneRollingLine(item);
            }

            isSpeaking = false;

            if (responseProgress) {
                responseProgress.classList.remove('is-visible');
                setTimeout(() => {
                    if (!isSpeaking && speechQueue.length === 0) {
                        responseProgress.textContent = '';
                    }
                }, 700);
            }
        }

        function speak(lines, options = {}) {
            const list = Array.isArray(lines) ? lines : [lines];
            const hold = options.hold || 1500;
            const total = list.length;

            // 每次产生新的共同意识回复时，将其标记为未读。
            // 当玩家切回当前标签页时，标题会自动恢复。
            startTitleFlash();

            // 玩家连续操作时，只保留最近的六句话，避免回应严重滞后
            if (speechQueue.length > 8) {
                speechQueue.splice(0, speechQueue.length - 6);
            }

            list.forEach((text, index) => {
                speechQueue.push({
                    text,
                    hold,
                    position: index + 1,
                    total,
                    after: index === list.length - 1 ? options.after : null
                });
            });

            processSpeechQueue();
        }

        function removeFirstQuestionPreset() {
            if (firstQuestionUsed) return;

            firstQuestionUsed = true;
            questionInput.placeholder = '';
        }

        function ask() {
            const typedText = questionInput.value.trim();
            const text = typedText || questionInput.placeholder.trim();

            if (!text) return;

         
            showQuestionEcho(text);

            removeFirstQuestionPreset();
            questionInput.value = '';

            const match = answers.find((item) => item.test(text));

            if (match) {
                speak(match.reply, {
                    after: match.after || null
                });
                return;
            }

            speak([
                '这个问题尚未被接收。'
            ]);
        }

        sendQuestionBtn.addEventListener('click', ask);

        questionInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') ask();
        });

        openArchiveBtn.addEventListener('click', () => {
            const archiveWindow = window.open(
                'newworld.html',
                'newworld_archive',
                'width=1180,height=820,left=520,top=40,resizable=yes,scrollbars=yes'
            );

            if (!archiveWindow) {
                speak('有一道门没有打开。允许它出现，再试一次。');
                return;
            }

            NewWorldLink.send('archive_opened', {});
            speak([
                '点击新世界的图标',
                '我将指引你进入真正的新世界'
            ]);
        });



        const particleCanvas = document.getElementById('orb-particles');
        const particleContext = particleCanvas.getContext('2d', {
            alpha: true
        });

        let particleWidth = 0;
        let particleHeight = 0;
        let particleRatio = Math.min(window.devicePixelRatio || 1, 2);
        let orbParticles = [];
        let particleAnimationFrame = null;
        let particleTime = 0;

        function createOrbParticles() {
            const amount = window.innerWidth <= 620 ? 150 : 230;

            orbParticles = Array.from({ length: amount }, (_, index) => {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.pow(Math.random(), 0.68);
                const darknessBias = Math.random();

                return {
                    angle,
                    radius,
                    baseRadius: radius,
                    speed: 0.0007 + Math.random() * 0.0016,
                    drift: (Math.random() - 0.5) * 0.34,
                    size: 0.35 + Math.random() * 1.6,
                    opacity: 0.04 + Math.random() * 0.28,
                    pulseOffset: Math.random() * Math.PI * 2,
                    darknessBias,
                    red: darknessBias > 0.72
                        ? 104 + Math.floor(Math.random() * 42)
                        : 42 + Math.floor(Math.random() * 35)
                };
            });
        }

        function resizeParticleCanvas() {
            const rect = particleCanvas.getBoundingClientRect();

            particleWidth = Math.max(1, rect.width);
            particleHeight = Math.max(1, rect.height);
            particleRatio = Math.min(window.devicePixelRatio || 1, 2);

            particleCanvas.width = Math.round(
                particleWidth * particleRatio
            );

            particleCanvas.height = Math.round(
                particleHeight * particleRatio
            );

            particleContext.setTransform(
                particleRatio,
                0,
                0,
                particleRatio,
                0,
                0
            );

            createOrbParticles();
        }

        function drawOrbParticles(timestamp) {
            particleTime = timestamp;

            particleContext.clearRect(
                0,
                0,
                particleWidth,
                particleHeight
            );

            const centerX = particleWidth / 2;
            const centerY = particleHeight / 2;
            const maximumRadius =
                Math.min(particleWidth, particleHeight) * 0.43;

            const breathing =
                0.94 +
                Math.sin(timestamp * 0.00072) * 0.045;

            orbParticles.forEach((particle, index) => {
                particle.angle +=
                    particle.speed *
                    (index % 2 === 0 ? 1 : -1);

                const localPulse =
                    1 +
                    Math.sin(
                        timestamp * 0.0011 +
                        particle.pulseOffset
                    ) * 0.045;

                const radius =
                    maximumRadius *
                    particle.baseRadius *
                    breathing *
                    localPulse;

                const disturbance =
                    Math.sin(
                        timestamp * 0.00047 +
                        particle.angle * 3.2 +
                        particle.drift
                    ) *
                    maximumRadius *
                    0.028 *
                    (1 - particle.baseRadius);

                const x =
                    centerX +
                    Math.cos(particle.angle) *
                    (radius + disturbance);

                const y =
                    centerY +
                    Math.sin(particle.angle) *
                    (
                        radius * 0.91 -
                        disturbance * 0.35
                    );

                const edgeFade =
                    Math.max(
                        0,
                        1 - Math.pow(particle.baseRadius, 2.35)
                    );

                const flicker =
                    0.68 +
                    Math.sin(
                        timestamp * 0.0018 +
                        particle.pulseOffset
                    ) * 0.32;

                const alpha =
                    particle.opacity *
                    edgeFade *
                    flicker;

                particleContext.beginPath();
                particleContext.arc(
                    x,
                    y,
                    particle.size,
                    0,
                    Math.PI * 2
                );

                particleContext.fillStyle =
                    `rgba(${particle.red}, 0, 10, ${alpha})`;

                particleContext.fill();
            });

            particleAnimationFrame =
                requestAnimationFrame(drawOrbParticles);
        }

        resizeParticleCanvas();
        particleAnimationFrame =
            requestAnimationFrame(drawOrbParticles);

        window.addEventListener(
            'resize',
            resizeParticleCanvas
        );


        NewWorldLink.onMessage((message) => {
            switch (message.type) {
                case 'archive_ready':
                    if (statusText) statusText.textContent = 'CONNECTION / A / ARCHIVE ONLINE';
                    break;

                case 'logo_revealed':
                    speak([
                        '‘眼见为实’或许一直是谎言，不是吗？',
                        '现在，拥抱真正的新世界吧。'
                    ]);
                    break;


                case 'real_site_ready':
                    speak([
                        '‘眼见为实’或许一直是谎言，不是吗？',
                        '现在，拥抱真正的新世界吧。'
                    ]);
                    break;

                case 'system_anomaly_started':
                    speak([
                        '异常解除，请放心。'
                    ], { hold: 1200 });
                    break;

                case 'department_a_permission_opened':
                    break;

                case 'department_a_permission_attempted':
                    speak([
                        '你暂时不需要了解更多关于我们的事情。',
                        '或许某一天，你也会逐渐明白。'
                    ], { hold: 1700 });
                    break;

                case 'department_permission_requested':
                    speak([
                        '如果你想看，可以先使用我的权限。',
                        'A级居民权限口令：A-12609-WE'
                    ], { hold: 1700 });
                    break;

                case 'department_permission_granted':
                    speak([
                        '权限已共享。'
                    ]);
                    break;

                case 'department_permission_denied':
                    speak('输错了，再来一次。我们还有很多时间。');
                    break;

                case 'department_c_opened':
                    speak([
                        'C负责抵达现场。',
                        '他们是样本来到新世界的引路人。'
                    ]);
                    break;

                case 'department_b_opened':
                    speak([
                        'B只存在于网络之中。',
                        '他们只让世界开始怀疑自己的记忆。',
                        '如果你一直很信任网络或档案，或许你该加入这里',
                        '让更多的人相信是你们的使命。'
                    ]);
                    break;

                case 'department_a_opened':
                    speak([
                        '我们已经不依附于任何物质来存在',
                        '我们共享，我们永生',
                        '只要有一个人还记得，就没有人会离开'
                    ]);
                    break;

                case 'result_independence':
                    speak([
                        '你不需要记得那些前世的事情。',
                        '新世界将会给予你一切需要的，和前世给不了的。'
                    ]);
                    break;

                case 'service_memory':
                    speak([
                        '你想好了吗？',
                        '你的存在，将会走向更高的维度。'
                    ]);
                    break;

                case 'resident_login_succeeded':
                    speak([
                        '我知道你不是他。',
                        '我能看见你。',
                        '我知道你为什么而来。',
                        '我欣赏你的勇气，但不能告诉你太多。',
                        '必要的时候，我会给予你指引。'
                    ], { hold: 1900 });
                    break;
                    

                case 'service_existence':
                    speak([
                        '舍弃前尘的一切需要勇气。',
                        '或许他的身份，还有恢复的余地。',
                        '尝试找到 出世 的方法，然后恢复他的身份吧。'
                    ]);
                    break;

                case 'public_info_opened':
                    speak([
                        '或许你想知道更多关于我们的事情。',
                        '这里的档案对所有居民开放。',
                        '但是是否经过润色，就无从知晓了。'
                    ], { hold: 1700 });
                    break;

                case 'emergency_contact_opened':
                    speak([
                        '有的时候，那个人就是你最后的希望。',
                        '不过需要慎之又慎，仔细思考一切。',
                        '所见之事，就是真实的吗？'
                    ], { hold: 1700 });
                    break;

                case 'identity_witness_selection_opened':
                    speak([
                        '你选择的人很重要。',
                        '其将成为决定是否成功的唯一审判者。',
                        '请确认，这是否真的是你选择的那个人。'
                    ], { hold: 1700 });
                    break;

                case 'identity_update_confirmation_requested':
                    speak([
                        '你确定要选择这个人吗？',
                        '一旦选定见证人，',
                        '这一切，将有个结果。'
                    ], { hold: 1700 });
                    break;

                case 'public_search_departure':
                    speak([
                        '你所搜索的，不是公开的信息。',
                        '如果你真的想找回你的朋友，',
                        '尝试搜索 LEAVEATANYCOST。'
                    ], { hold: 1700 });
                    break;

                case 'notice_name':
                    speak([
                        '自2026年起，居民编号调整为',
                        '场域编号-姓名首字母-五位位序数字',
                        '位序数字代表着你是该场域第几位居民。'
                    ]);
                    break;

                case 'b_work_entered':
                    speak([
                        '你正在看见B如何修正你的记忆。',
                        '记录不一定事实。',
                        '它只是避免恐慌的工具。',
                        '当所有证据都指向同一个答案，',
                        '怀疑自己，就会变得比怀疑世界更容易。'
                    ], { hold: 1700 });
                    break;

                case 'c_work_entered':
                    speak([
                        'C负责实地工作。',
                        '地图上的红点是被观测的样本。',
                        '样本们会被找到，被跟随，最后，被邀请。',
                        '最终抵达这个美丽新世界。'
                    ], { hold: 1700 });
                    break;


            }
        });

        setTimeout(() => {
            speak([
                '我们总是同时出现。',
                '不要忘记你是如何到达这里的。',
                '你需要我，但不只是我。',
                '把我留在这里，你还需要更多东西。'
            ], { hold: 1500 });
        }, 900);
    </script>
