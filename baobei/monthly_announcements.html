<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本月公告｜新世界居民服务平台</title>
<script src="newworld_link.js"></script>
<style>
:root{
    --bg:#000;
    --text:#f3f3f3;
    --muted:#858585;
    --line:rgba(255,255,255,.22);
    --soft:rgba(255,255,255,.10);
    --red:#ff0000;
}
*{box-sizing:border-box}
html,body{
    margin:0;
    min-height:100%;
    background:#000;
    color:var(--text);
    font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding:34px 28px 70px}
.shell{width:min(980px,100%);margin:0 auto}
.topbar{
    display:flex;align-items:center;gap:18px;
    padding-bottom:20px;border-bottom:1px solid var(--line)
}
.back-link{color:#aaa;text-decoration:none;font-size:11px}
.back-link:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}
.top-actions{margin-left:auto}
.publish-button{
    padding:10px 16px;border:1px solid #fff;border-radius:0;
    background:#fff;color:#000;font-size:11px;font-weight:600
}
.publish-button:hover{background:#ddd}
.heading{
    display:flex;justify-content:space-between;gap:30px;
    padding:42px 0 28px;border-bottom:1px solid var(--line)
}
.kicker{margin:0 0 10px;color:var(--muted);font-size:9px;letter-spacing:3px}
.heading h1{
    margin:0;font-family:"Noto Serif SC","Songti SC",SimSun,serif;
    font-size:38px;font-weight:500
}
.heading p{
    width:min(420px,100%);margin:4px 0 0;
    color:var(--muted);font-size:11px;line-height:1.8
}
.notice-list{border-top:1px solid var(--soft)}
.notice-card{
    padding:22px 0;border-bottom:1px solid var(--soft)
}
.notice-meta{
    display:flex;justify-content:space-between;gap:20px;
    margin-bottom:10px;color:var(--muted);font-size:9px
}
.notice-card h2{
    margin:0 0 10px;font-family:"Noto Serif SC","Songti SC",SimSun,serif;
    font-size:20px;font-weight:500
}
.notice-card p{margin:0;color:#aaa;font-size:12px;line-height:1.9;white-space:pre-wrap}
.empty{padding:36px 0;color:var(--muted);font-size:12px}
.modal[hidden]{display:none}
.modal{
    position:fixed;inset:0;z-index:1000;
    display:grid;place-items:center;padding:20px
}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.86)}
.dialog{
    position:relative;z-index:1;width:min(520px,100%);
    padding:30px;border:1px solid var(--line);background:#000
}
.dialog h2{
    margin:0 0 12px;font-family:"Noto Serif SC","Songti SC",SimSun,serif;
    font-size:26px;font-weight:500
}
.dialog-description{margin:0 0 24px;color:#888;font-size:11px;line-height:1.8}
.field{display:grid;gap:8px;margin-top:18px}
.field label{color:#aaa;font-size:10px}
.field input,.field textarea{
    width:100%;border:0;border-bottom:1px solid var(--line);
    border-radius:0;outline:none;background:#000;color:#fff
}
.field input{height:44px}
.field textarea{min-height:150px;padding:12px 0;resize:vertical}
.field input:focus,.field textarea:focus{border-bottom-color:#fff}
.feedback{min-height:18px;margin:12px 0 0;color:var(--red);font-size:10px}
.dialog-actions{
    display:flex;justify-content:flex-end;gap:10px;
    margin-top:24px;padding-top:18px;border-top:1px solid var(--line)
}
.primary,.secondary{
    min-width:110px;padding:10px 14px;border-radius:0
}
.primary{border:1px solid #fff;background:#fff;color:#000;font-weight:600}
.secondary{border:1px solid var(--line);background:#000;color:#aaa}
.secondary:hover{border-color:#fff;color:#fff}
@media(max-width:680px){
    .page{padding:24px 18px 54px}
    .heading{display:block}
    .heading p{margin-top:18px}
    .heading h1{font-size:30px}
}
</style>
</head>
<body>
<main class="page">
    <div class="shell">
        <header class="topbar">
            <a class="back-link" href="newworld_real.html#notices">← 返回居民服务平台</a>
            <div class="top-actions">
                <button id="publish-entry" class="publish-button" type="button">发布公告</button>
            </div>
        </header>

        <section class="heading">
            <div>
                <p class="kicker">MONTHLY ANNOUNCEMENTS</p>
                <h1>本月公告</h1>
            </div>
        </section>

        <section id="notice-list" class="notice-list"></section>
    </div>
</main>

<section id="login-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-login></div>
    <div class="dialog">
        <h2>管理员登录</h2>
        <p class="dialog-description">仅管理员可以发布公告。</p>

        <div class="field">
            <label for="admin-id">管理员编号</label>
            <input id="admin-id" type="text" autocomplete="username">
        </div>

        <div class="field">
            <label for="admin-password">密码</label>
            <input id="admin-password" type="password" autocomplete="current-password">
        </div>

        <p id="login-feedback" class="feedback"></p>

        <div class="dialog-actions">
            <button class="secondary" type="button" data-close-login>取消</button>
            <button id="login-submit" class="primary" type="button">登录</button>
        </div>
    </div>
</section>

<section id="publish-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-publish></div>
    <div class="dialog">
        <h2>发布公告</h2>
        <p class="dialog-description">公告发布后将立即出现在本月公告列表中。</p>

        <div class="field">
            <label for="notice-title">公告标题</label>
            <input id="notice-title" type="text">
        </div>

        <div class="field">
            <label for="notice-body">公告正文</label>
            <textarea id="notice-body"></textarea>
        </div>

        <p id="publish-feedback" class="feedback"></p>

        <div class="dialog-actions">
            <button class="secondary" type="button" data-close-publish>取消</button>
            <button id="publish-submit" class="primary" type="button">确认发布</button>
        </div>
    </div>
</section>

<script>
const ANNOUNCEMENT_STORAGE_KEY = 'newworld_monthly_announcements';
const ADMIN_SESSION_KEY = 'newworld_admin_authenticated';

// 暂时留空：当前阶段任意非空编号和密码都可登录。
// 后续填写后，系统会自动改为严格匹配。
const ADMIN_CONFIG = {
    adminId: '',
    password: '12441'
};

const defaultAnnouncements = [
    {
        id: 'default_1',
        title: '新场域建设通知与人员协调',
        body: 'C209新场域即将建设完毕，请各位居民注意场域建设期间的安全事项，并配合相关人员的协调工作。',
        author: 'C级场域',
        createdAt: '2026-07-31 09:20'
    },
    {
        id: 'default_2',
        title: '音频矫正工作升级',
        body: '音频矫正技术全面升级，请联系B级居民进行相关工作。',
        author: 'B级场域',
        createdAt: '2026-07-30 14:10'
    },
    {
        id: 'default_3',
        title: '夜间运输通知',
        body: '本月夜间运输时间进行调整。',
        author: 'C级场域',
        createdAt: '2026-07-28 08:00'
    }
];

const noticeList = document.getElementById('notice-list');
const publishEntry = document.getElementById('publish-entry');

const loginModal = document.getElementById('login-modal');
const adminIdInput = document.getElementById('admin-id');
const adminPasswordInput = document.getElementById('admin-password');
const loginFeedback = document.getElementById('login-feedback');
const loginSubmit = document.getElementById('login-submit');

const publishModal = document.getElementById('publish-modal');
const noticeTitle = document.getElementById('notice-title');
const noticeBody = document.getElementById('notice-body');
const publishFeedback = document.getElementById('publish-feedback');
const publishSubmit = document.getElementById('publish-submit');

function escapeHTML(value) {
    return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function readAnnouncements() {
    try {
        const raw = localStorage.getItem(ANNOUNCEMENT_STORAGE_KEY);

        if (!raw) {
            localStorage.setItem(
                ANNOUNCEMENT_STORAGE_KEY,
                JSON.stringify(defaultAnnouncements)
            );

            return [...defaultAnnouncements];
        }

        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [...defaultAnnouncements];
    } catch (error) {
        return [...defaultAnnouncements];
    }
}

function saveAnnouncements(items) {
    localStorage.setItem(
        ANNOUNCEMENT_STORAGE_KEY,
        JSON.stringify(items)
    );
}

function renderAnnouncements() {
    const announcements = readAnnouncements()
        .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));

    if (!announcements.length) {
        noticeList.innerHTML = '<div class="empty">本月暂无公告。</div>';
        return;
    }

    noticeList.innerHTML = announcements.map(item => `
        <article class="notice-card">
            <div class="notice-meta">
                <span>${escapeHTML(item.author || '场域管理员')}</span>
                <time>${escapeHTML(item.createdAt || '')}</time>
            </div>
            <h2>${escapeHTML(item.title)}</h2>
            <p>${escapeHTML(item.body)}</p>
        </article>
    `).join('');
}

function isAdminAuthenticated() {
    return sessionStorage.getItem(ADMIN_SESSION_KEY) === 'true';
}

function credentialsValid(id, password) {
    const configuredId = ADMIN_CONFIG.adminId.trim();
    const configuredPassword = ADMIN_CONFIG.password.trim();

    if (!configuredId || !configuredPassword) {
        return Boolean(id && password);
    }

    return (
        id.toUpperCase() === configuredId.toUpperCase() &&
        password === configuredPassword
    );
}

function openLogin() {
    loginFeedback.textContent = '';
    adminIdInput.value = '';
    adminPasswordInput.value = '';
    loginModal.hidden = false;

    requestAnimationFrame(() => adminIdInput.focus());
}

function openPublish() {
    publishFeedback.textContent = '';
    noticeTitle.value = '';
    noticeBody.value = '';
    publishModal.hidden = false;

    requestAnimationFrame(() => noticeTitle.focus());
}

publishEntry.addEventListener('click', () => {
    if (isAdminAuthenticated()) {
        openPublish();
        return;
    }

    openLogin();
});

loginSubmit.addEventListener('click', () => {
    const id = adminIdInput.value.trim();
    const password = adminPasswordInput.value.trim();

    if (!credentialsValid(id, password)) {
        loginFeedback.textContent = '管理员编号或密码错误';
        return;
    }

    sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
    location.href = 'admin.html';
});

[adminIdInput, adminPasswordInput].forEach(input => {
    input.addEventListener('keydown', event => {
        if (event.key === 'Enter') loginSubmit.click();
    });
});

publishSubmit.addEventListener('click', () => {
    const title = noticeTitle.value.trim();
    const body = noticeBody.value.trim();

    if (!title || !body) {
        publishFeedback.textContent = '请填写公告标题和正文';
        return;
    }

    const announcements = readAnnouncements();

    announcements.push({
        id: 'notice_' + Date.now(),
        title,
        body,
        author: '场域管理员',
        createdAt: new Date().toLocaleString('zh-CN', {
            hour12: false
        })
    });

    saveAnnouncements(announcements);
    renderAnnouncements();
    publishModal.hidden = true;

    NewWorldLink.send('admin_announcement_published', {
        title
    });
});

document.querySelectorAll('[data-close-login]').forEach(element => {
    element.addEventListener('click', () => {
        loginModal.hidden = true;
    });
});

document.querySelectorAll('[data-close-publish]').forEach(element => {
    element.addEventListener('click', () => {
        publishModal.hidden = true;
    });
});

renderAnnouncements();
</script>
</body>
</html>
