<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时令水果测评 - 厨得快</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container subpage-header-container">
            <div class="logo-area subpage-logo-area">
                <a href="index.html">
                    <img src="assets/logo/厨得快1.png" alt="Logo" class="logo-img">
                </a>
                <a href="index.html" class="back-home-link">返回首页</a>
            </div>
        </div>
    </header>

    <div class="live-top-banner">
        <img src="assets/banner_fruit.png" alt="时令水果">
    </div>

    <main class="main-content container">
        <div class="content-box fruit-content-box">
            <h1 style="margin-bottom: 20px;">本周推荐：初夏时令水果全方位测评</h1>
            <p style="color:#666; margin-bottom: 20px;">甜度、水分、性价比大PK，教你如何挑到最甜的那一颗！</p>
            
            <div style="margin-bottom: 15px; border-left: 4px solid #f4b057; padding-left: 10px;">
                <h4>1. 东魁杨梅 <span class="fruit-rating-tag">强烈推荐</span></h4>
                <p style="font-size: 14px; color:#555; margin-top: 5px;">测评结果：果肉饱满、汁水充沛。单果甜度可达 13.5 Brix，酸甜适口，非常适合夏日解暑。</p>
            </div>
            
            <div style="margin-bottom: 15px; border-left: 4px solid #f4b057; padding-left: 10px;">
                <h4>2. 妃子笑荔枝 <span class="fruit-rating-tag">较高性价比</span></h4>
                <p style="font-size: 14px; color:#555; margin-top: 5px;">测评结果：核心较小，皮薄肉厚。不过买的时候注意挑选青中带红的更加爽脆清甜。</p>
            </div>
        </div>
    </main>

    <footer class="simple-site-footer">

    </footer>

    <script src="global.js"></script>
</body>
</html>
