<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厨得快 - 官方内测直播间</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 输入框 */
        @keyframes gentle-fill-glow {
            0% {
                background-color: rgba(244, 176, 87, 0.03);
                border-color: rgba(244, 176, 87, 0.25);
            }
            50% {
                /* 最亮 */
                background-color: rgba(255, 145, 0, 0.461);
                border-color: rgba(255, 106, 0, 0.8);
            }
            100% {
                background-color: rgba(244, 176, 87, 0.03);
                border-color: rgba(244, 176, 87, 0.25);
            }
        }

        .chat-input-row {
            border: 1px solid rgba(244, 176, 87, 0.25);
            border-radius: 8px; 
            background-color: rgba(244, 176, 87, 0.03);
            animation: gentle-fill-glow 2.8s infinite ease-in-out; /* 闪光周期 */
            transition: background-color 0.4s, border-color 0.4s;
        }

        .chat-input-row:focus-within {
            animation-play-state: paused;
            background-color: rgba(244, 176, 87, 0.08);
            border-color: rgba(244, 176, 87, 1);
        }

        .send-chat-btn {
            font-size: 13px !important;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; z-index: 999999; display: none;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-family: sans-serif;">
            <div style="font-size: 18px; color: #333; margin-bottom: 18px; font-weight: bold; letter-spacing: 1px;">加密直播连接中，可能出现卡顿...</div>
            <div style="width: 260px; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin: 0 auto;">
                <div id="loading-progress-bar" style="width: 0%; height: 100%; background: #f4b057; border-radius: 3px; transition: width 3s linear;"></div>
            </div>
        </div>
    </div>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-area">
                <a href="index.html"><img src="assets/logo/厨得快1.png" alt="Logo" class="logo-img" id="header-logo-img"></a>
            </div>
            <nav class="category-nav">
                <a href="index.html" class="nav-item" id="safe-exit-btn">安全退出</a>
            </nav>
            <div class="search-area"></div>
        </div>
    </header>

    <main class="main-content container">
        <div class="live-room-layout">
            <div class="video-box-area">
                </div>

            <div class="live-chat-panel">
                <div class="chat-panel-header">
                    <span>互动聊天室 <span class="live-status-tag">LIVE</span></span>
                    <span style="color:#888; font-size:12px; font-weight:normal;">在线：2,481 人</span>
                </div>
                <div id="chat-box" class="chat-messages-flow">
                    <div class="single-chat-line" style="color: #999; text-align: center;">系统提示：厨得快绿色直播间已开启，严禁发布违规内容。</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="user-input" class="chat-text-input" placeholder="输入弹幕，和大厨实时互动...">
                    <button id="send-btn" class="send-chat-btn">发送</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="simple-site-footer">
        Copyright &copy; 2026 厨得快平台管理中心. All Rights Reserved.
    </footer>

    <script src="global.js"></script>
    <script>
        // 连音频
        function handleAudioCheck() {
            while (true) {
                let isMuted = confirm("检测到您的设备音频连接失败，是否静音观看直播？");
                if (isMuted) {
                    break;
                } else {
                    alert("重连中..."); 
                }
            }
        }

        handleAudioCheck();

        // 进度条
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingProgressBar = document.getElementById('loading-progress-bar');
        loadingOverlay.style.display = 'block';
        setTimeout(() => {
            loadingProgressBar.style.width = '100%';
        }, 50);

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const videoBox = document.querySelector('.video-box-area');
        const headerLogoImg = document.getElementById('header-logo-img'); 

        const safeExitBtn = document.getElementById('safe-exit-btn');

        safeExitBtn.addEventListener('click', function (event) {
            event.preventDefault();

            // 创建邮箱
            getOrCreateLocalUsername();
            localStorage.setItem('mail_created', 'true');
            localStorage.setItem('mail_password', 'chudekuai123');
            localStorage.setItem('mail_created_notice_pending', 'true');

            // 返回首页
            window.location.href = 'index.html';
        });

        videoBox.innerHTML = '';
        const videoImg = document.createElement('img');
        videoImg.style.width = '100%';
        videoImg.style.height = '100%';
        videoImg.style.objectFit = 'cover';
        videoImg.style.display = 'block';
        videoBox.appendChild(videoImg);

        const frames = [
            'assets/live/ss1.jpg',
            'assets/live/ss2.jpg',
            'assets/live/ss3.jpg',
            'assets/live/ss4.jpg',
            'assets/live/ss5.jpg',
            'assets/live/ss6.jpg',
            'assets/live/ss7.1.jpg',
            'assets/live/ss7.jpg',
            'assets/live/ss8.jpg',
        ];
        
        const secondaryFrames = [
            'assets/live/ss9.jpg',
            'assets/live/ss10.jpg',
            'assets/live/ss11.jpg',
            'assets/live/ss12.jpg',
            'assets/live/ss13.jpg',
            'assets/live/ss14.jpg',
            'assets/live/ss15.jpg',
            'assets/live/ss16.jpg',
            'assets/live/ss17.jpg',
            'assets/live/ss18.jpg',
            'assets/live/load.jpg',
        ];

        let frameIndex = 0;
        let secondaryIndex = 0; // 第二阶段数组指针
        let finalLoopIndex = 0; // 最终循环数组指针
        let isKicked = false;
        let meatPlayed = false; // meat绝对锁
        let inSecondaryPhase = false;
        let inFinalLoopPhase = false;

        // 所有画面播完后，循环播放 ss17、ss18、load
        const finalLoopFrames = [
            {
                src: 'assets/live/ss17.jpg',
                duration: 1200
            },
            {
                src: 'assets/live/ss18.jpg',
                duration: 1200
            },
            {
                src: 'assets/live/load.jpg',
                duration: 2400 // load 停留时间是 ss17 / ss18 的两倍
            }
        ];

        const meatAudio = new Audio('assets/live/meat.mp3');

        function getOrCreateLocalUsername() {
            let username = localStorage.getItem('mail_username');

            if (!username) {
                const raw = navigator.platform + navigator.language + navigator.userAgent;
                let hash = 0;

                for (let i = 0; i < raw.length; i++) {
                    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                    hash |= 0;
                }

                const code = Math.abs(hash).toString(36).slice(0, 6).toUpperCase();
                username = 'DESKTOP-' + code;

                localStorage.setItem('mail_username', username);
            }

            return username;
        }

        // 统一提取公共踢出处理函数
        function executeKickProcedure() {
            isKicked = true;
            clearInterval(chatIntervalId);
            document.body.classList.remove('glitch-invert-active');
            if (headerLogoImg) headerLogoImg.src = 'assets/logo/厨得快1.png';
            meatAudio.pause();

            // 创建邮箱
            const createdUsername = getOrCreateLocalUsername();
            localStorage.setItem('mail_created', 'true');
            localStorage.setItem('mail_password', 'chudekuai123');

            localStorage.setItem('mail_created_notice_pending', 'true');

            alert("检测到账号异常，您已被踢出直播间。");
            window.location.href = 'index.html';
        }

        function runVideoLoop() {
            if (isKicked) return;

            if (inSecondaryPhase) {
                // 第二阶段 ss9-ss18 全部播完后，进入最终循环阶段
                if (secondaryIndex >= secondaryFrames.length) {
                    inSecondaryPhase = false;
                    inFinalLoopPhase = true;
                    finalLoopIndex = 0;
                    runVideoLoop();
                    return;
                }

                // 播放第二阶段故障画面
                videoImg.src = secondaryFrames[secondaryIndex];
                videoImg.style.display = 'block';
                secondaryIndex++;

                let randomDuration = 1000 + Math.random() * 1500;
                setTimeout(runVideoLoop, randomDuration);
                return;
            }

            // 最终循环阶段：ss17 → ss18 → load.png，不断循环
            if (inFinalLoopPhase) {
                const currentFrame = finalLoopFrames[finalLoopIndex];

                videoImg.src = currentFrame.src;
                videoImg.style.display = 'block';

                finalLoopIndex = (finalLoopIndex + 1) % finalLoopFrames.length;

                setTimeout(runVideoLoop, currentFrame.duration);
                return;
            }

            // 分支 B: 常规 1-7 张基础循环片控制段
            if (frameIndex >= frames.length) {
                if (!meatPlayed) {
                    meatPlayed = true; // 触发后立即锁死路径
                    
                    // ① 建立一个置顶的全网页纯黑遮罩层，让整个屏幕全黑
                    const fullPageBlack = document.createElement('div');
                    fullPageBlack.style.position = 'fixed';
                    fullPageBlack.style.top = '0';
                    fullPageBlack.style.left = '0';
                    fullPageBlack.style.width = '100vw';
                    fullPageBlack.style.height = '100vh';
                    fullPageBlack.style.background = '#000000';
                    fullPageBlack.style.zIndex = '999999';
                    document.body.appendChild(fullPageBlack);

                    setTimeout(() => {
                        if (isKicked) {
                            fullPageBlack.remove();
                            return;
                        }
                        
                        // 移除全屏纯黑遮罩，暴露出惊悚 meat 画面与全网页反色
                        fullPageBlack.remove();
                        
                        // ② 展现惊悚 meat 画面、音频、全网页反色，并将Logo变成“厨得快2”
                        videoImg.src = 'assets/live/meat.jpg';
                        videoImg.style.display = 'block';
                        if (headerLogoImg) headerLogoImg.src = 'assets/logo/厨得快2.png'; // 触发时变更为 厨得快2
                        
                        meatAudio.play().catch(err => console.log("音频流播放受限:", err));
                        document.body.classList.add('glitch-invert-active');

                        // ③ meat 画面停留1秒后，再次全网页黑屏，模拟画面断流
                        setTimeout(() => {
                            if (isKicked) return;

                            // 建立第二次全网页纯黑遮罩层，让 meat 消失时也闪黑
                            const fullPageBlackAfterMeat = document.createElement('div');
                            fullPageBlackAfterMeat.style.position = 'fixed';
                            fullPageBlackAfterMeat.style.top = '0';
                            fullPageBlackAfterMeat.style.left = '0';
                            fullPageBlackAfterMeat.style.width = '100vw';
                            fullPageBlackAfterMeat.style.height = '100vh';
                            fullPageBlackAfterMeat.style.background = '#000000';
                            fullPageBlackAfterMeat.style.zIndex = '999999';
                            document.body.appendChild(fullPageBlackAfterMeat);

                            // 在黑屏期间拔除故障状态并恢复 Logo
                            document.body.classList.remove('glitch-invert-active');
                            if (headerLogoImg) headerLogoImg.src = 'assets/logo/厨得快1.png';

                            setTimeout(() => {
                                if (isKicked) {
                                    fullPageBlackAfterMeat.remove();
                                    return;
                                }

                                // 黑屏结束，切入第二阶段 ss8-ss15
                                fullPageBlackAfterMeat.remove();

                                inSecondaryPhase = true;
                                secondaryIndex = 0;

                                runVideoLoop();
                            }, 500);

                        }, 1000);

                    }, 500); // 整个网页全黑持续500毫秒
                    
                    return; // 拦截本次定时，不允许穿透
                } else {
                    frameIndex = 0; // 安全兜底防错
                }
            }

            // 纯净的常规 1-7 帧画面渲染
            videoImg.src = frames[frameIndex];
            videoImg.style.display = 'block';
            frameIndex++;

            // 0.5秒到2秒之间的动态随机卡顿频率
            let randomDuration = 500 + Math.random() * 1500;
            setTimeout(runVideoLoop, randomDuration);
        }

        // ==================== 4. 互动聊天流与突发异常事件控制 ====================
        const bulletLibrary = [
            "等了好久了，终于开播啦！",
            "前排搬板凳围观，今天教哪道硬菜呀？",
            "厨得快这个网站真给力，卡点进来了！",
            "张大厨真人好帅啊哈哈哈",
            "极其期待今天晚上的独家配方！",
            "上周跟着步骤做了红烧肉，全家人都夸我",
            "打卡打卡！支持老张大厨",
            "求问大厨，土豆丝怎么炒才能更脆？",
            "密钥拿到了，赶紧进来占座！",
            "画质好清晰啊，赞一个",
            "今晚必须学废它，明天就去买食材",
            "想问下大厨，炖肉怎么做到软烂不柴？",
            "上次学的菜大获成功，今天继续进修！",
            "蹲一个实用家常菜，新手求指教",
            "终于等到独家秘方，这下有口福啦"
        ];

        let hasUserSentMessage = false;
        let chatIntervalId = null;

        function insertMessage(sender, msgText, isMySelf = false) {
            const line = document.createElement('div');
            line.className = 'single-chat-line';
            if(isMySelf) line.style.background = '#fff6ea';
            line.innerHTML = `<span class="user-name-tag">${sender}:</span>${msgText}`;
            chatBox.appendChild(line);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 触发密集型“发现外人”警报弹幕
        function triggerAgressiveSpam() {
            clearInterval(chatIntervalId); 
            
            chatIntervalId = setInterval(() => {
                if (isKicked) return;
                const randomUser = "匿名用户" + Math.floor(Math.random() * 800 + 100);
                insertMessage(randomUser, "怎么有外人进来了？");
            }, 600); 
        }

        // 发送消息处理函数
        function performSend() {
            const text = userInput.value.trim();
            if (!text || isKicked) return;

            insertMessage("我", text, true);
            userInput.value = '';

            if (!hasUserSentMessage) {
                hasUserSentMessage = true;
                
                // 1. 开始高频刷屏
                triggerAgressiveSpam();

                // 2. 5秒之后执行强制踢出
                setTimeout(() => {
                    if (isKicked) return;
                    executeKickProcedure();
                }, 5000);
            }
        }

        sendBtn.addEventListener('click', performSend);
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') performSend(); });

        // ==================== 5. 正式开播守护线程（等待3秒进度条完毕） ====================
        setTimeout(() => {
            // 3秒到期，平滑销毁连接中遮罩层
            loadingOverlay.remove();
            
            // 正式驱动核心业务逻辑
            runVideoLoop();

            // 初始正常弹幕流动循环
            chatIntervalId = setInterval(() => {
                if (isKicked) return;
                const randomUser = "匿名用户" + Math.floor(Math.random() * 800 + 100);
                const randomText = bulletLibrary[Math.floor(Math.random() * bulletLibrary.length)];
                insertMessage(randomUser, randomText);
            }, 1400);

        }, 3000);
    </script>
</body>
</html>
